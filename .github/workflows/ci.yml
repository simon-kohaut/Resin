name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install clingo
        run: |
          # Install clingo into environment
          pip install clingo
          CLINGO_DIR=$(python3 -c "import clingo, os; print(os.path.dirname(clingo.__file__))")
          LIB_PATH=$(ls "$CLINGO_DIR" | grep "cpython" | head -n 1)
          ln -sf "$CLINGO_DIR/$LIB_PATH" "$CLINGO_DIR/libclingo.so"
          echo "CLINGO_LIBRARY_PATH=$CLINGO_DIR" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=$CLINGO_DIR" >> $GITHUB_ENV

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --features python-bindings -- -D warnings

      - name: Test
        run: cargo test --features python-bindings
