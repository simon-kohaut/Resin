name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install clingo
        run: |
          sudo add-apt-repository ppa:potassco/stable
          sudo apt update
          sudo apt-get install -y clingo graphviz
          CLINGO_LIB=$(find /usr -name "libclingo.so*" | head -1)
          echo "CLINGO_LIBRARY_PATH=$(dirname "$CLINGO_LIB")" >> $GITHUB_ENV

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --features python-bindings -- -D warnings

      - name: Test
        run: cargo test --features python-bindings
