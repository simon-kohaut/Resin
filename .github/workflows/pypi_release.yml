name: "Release to PyPI"

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
            rustflags: "-C target-feature=+avx2,+fma"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - name: Build sdist
        if: matrix.platform.target == 'x86_64'
        run: |
          pip install maturin
          maturin sdist --out dist
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: auto
          before-script-linux: |
              python3 -m pip install clingo
              CLINGO_DIR=$(python3 -c "import clingo, os; print(os.path.dirname(clingo.__file__))")
              LIB_PATH=$(ls "$CLINGO_DIR" | grep "cpython" | head -n 1)
              ln -sf $LIB_PATH "$CLINGO_DIR"/libclingo.so
              export CLINGO_LIBRARY_PATH="$CLINGO_DIR"
        env:
          RUSTFLAGS: ${{ matrix.platform.rustflags }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: dist

