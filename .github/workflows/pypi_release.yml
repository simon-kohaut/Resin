  windows:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: windows-latest
            target: x64
            python_arch: x64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
          architecture: ${{ matrix.platform.python_arch }}
      - name: Install dependencies
        run: |
          pip install delvewheel
      - name: Install miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
      - name: Get clingo C library via conda
        shell: powershell
        run: |
          # Pinned to match clingo-sys 0.7.2, which is generated against clingo 5.6.2.
          conda create -n clingo-build -c conda-forge clingo=5.6.2 -y
          $CondaRoot = (conda info --base).Trim()
          $CondaEnv = Join-Path $CondaRoot "envs\clingo-build"
          # Library\lib holds the .lib import library used at link time.
          # Library\bin holds the actual clingo.dll needed at runtime by delvewheel.
          $ClingoLibDir = Join-Path $CondaEnv "Library\lib"
          $ClingoBinDir = Join-Path $CondaEnv "Library\bin"
          echo "CLINGO_LIBRARY_PATH=$ClingoLibDir" >> $env:GITHUB_ENV
          echo "CLINGO_BIN_PATH=$ClingoBinDir" >> $env:GITHUB_ENV
      - name: Debug - list clingo lib and bin dirs
        shell: powershell
        run: |
          Get-ChildItem "$env:CLINGO_LIBRARY_PATH"
          Get-ChildItem "$env:CLINGO_BIN_PATH"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Repair wheels with delvewheel
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path repaired_dist
          Get-ChildItem -Path dist\*.whl | ForEach-Object {
              delvewheel repair --add-path "$env:CLINGO_LIBRARY_PATH;$env:CLINGO_BIN_PATH" -w repaired_dist $_.FullName
          }
          Remove-Item -Recurse -Force dist
          Move-Item repaired_dist dist
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: dist

  macos:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: macos-15-intel
            target: x86_64
            rustflags: "-C target-feature=+avx2,+fma"
          - runner: macos-latest
            target: aarch64
            rustflags: ""
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - name: Setup environment
        run: |
          brew install clingo
          CLINGO_PREFIX=$(brew --prefix clingo)
          echo "CLINGO_LIBRARY_PATH=${CLINGO_PREFIX}/lib" >> $GITHUB_ENV

          pip install delocate
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
        env:
          RUSTFLAGS: ${{ matrix.platform.rustflags }}
      - name: Repair wheels with delocate
        run: |
          # Embed the brew-installed dylibs into the wheel
          delocate-wheel -v dist/*.whl
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: dist

  release:
    name: Release
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs: [linux, macos, windows]  # , musllinux]
    permissions:
      id-token: write
      contents: write
    environment:
      name: pypi
      url: https://pypi.org/p/pyresin
    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
