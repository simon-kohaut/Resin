[package]
name = "resin"
edition = "2021"
version = "0.0.14"
description = "A reactive, probabilistic logic programming language using Reactive Circuits."
repository = "https://github.com/simon-kohaut/resin"
keywords = [
  "probabilistic logic",
  "reactive circuits",
]

[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 2

[profile.test]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

[lib]
name = "resin"
crate-type = ["cdylib", "rlib"]
[dependencies]
petgraph = "*"
plotly = "*"
ndarray = { version = "0.17.0", features=["approx"] } 
ndarray-rand = "0.16.0"
ndarray-npy = "*"
nalgebra = "0.34.0"
itertools = "*"
nom = "*"
regex = "*"
rand = "0.9"
lazy_static = "*"
linfa = "0.4"
linfa-nn = "0.5"
linfa-clustering = "0.4"
linfa-datasets = { version = "0.4", features = ["iris"] }
rand_xoshiro = "*"
approx = "*"
clingo = { version = "0.7.2", features = ["derive"] }
clap = { version = "4.4.1", features = ["derive"] }
rayon = "*"
chashmap = "*"
atomic_float = "*"
rand_distr = "*"
cpu-time = "*"
rand_chacha = "*"
polars = { version = "*", features = ["rows"] }
tempfile = "*"
pyo3 = { version = "0.27", features = ["extension-module"], optional = true }
numpy = { version = "0.27", optional = true }
rustc-hash = "2.1.3"

[features]
python-bindings = ["dep:pyo3", "dep:numpy"]
